runner_cfg:
  seed: 42                      # try 42 → 7 → 114514 if needed
  output_dir: results/VLM-DR

  optimizer_and_scheduler_cfg:
    param_dict_cfg:
      lr_image_encoder: 1.0e-05
      lr_text_encoder: 1.0e-08        # was 0.0 → freeze safely as float
      lr_prompt_learner_context: 1.0e-04
      lr_prompt_learner_ranks: 1.0e-04
      lr_logit_scale: 1.0e-08         # was 0.0 → freeze safely as float
      staged_lr_image_encoder:
        new_layers: []
        base_lr_mult: 1.0
        new_lr_mult: 1.0

    optimizer_cfg:
      optimizer_name: adamw           # AdamW for stability
      lr: 1.0e-04
      weight_decay: 1.0e-04           # small decay helps generalization
      momentum: 0.9
      sgd_dampening: 0.0
      sgd_nesterov: false
      rmsprop_alpha: 0.99
      adam_beta1: 0.9
      adam_beta2: 0.999
      staged_lr: null
      lookahead: false

    lr_scheduler_cfg:
      lr_scheduler_name: multi_step
      stepsize:            # milestones (must be < max_epochs)
        - 10
        - 20
        - 30
      gamma: 0.2
      max_epochs: &max_epochs 31
      warmup_epoch: 3
      warmup_type: linear
      warmup_cons_lr: 1.0e-05     # starting LR during warmup
      warmup_min_lr: 1.0e-05
      warmup_recount: true

  load_weights_cfg:
    init_model_weights: checkpoints/clipdr/APTOS.ckpt   # CLIP-DR checkpoint of the held-out target
    init_prompt_learner_weights: null
    init_image_encoder_weights: null          # load CLIP pretrained RN50
    init_text_encoder_weights: null           # load CLIP pretrained RN50

  model_cfg:
    type: CLIPDR
    prompt_learner_cfg:
      type: PlainPromptLearner
      num_ranks: 5
      num_tokens_per_rank: 1
      num_context_tokens: 10
      rank_tokens_position: tail
      init_rank_path: null
      init_context: null
      rank_specific_context: false
      interpolation_type: linear
    text_encoder_name: RN50
    image_encoder_name: RN50

data_cfg:
  train_images_root: images
  val_images_root: images
  test_images_root: images

  train_data_file: splits/train_noAPTOS.txt
  val_data_file: splits/val_noAPTOS.txt
  test_data_file: splits/test_APTOS.txt

  few_shot:
    num_shots: 0
  label_distributed_shift:
    num_topk_scaled_class: 0
    scale_factor: 1
  use_long_tail: false

  transforms_cfg:
    input_transforms:
      - random_resized_crop
      - random_hflip
      - normalize
    input_resize: [256, 256]
    input_size:   [224, 224]
    pixel_mean:   [0.485, 0.456, 0.406]
    pixel_std:    [0.229, 0.224, 0.225]

  train_dataloder_cfg:
    num_workers: 8
    shuffle: true
    batch_size: 64
    drop_last: true       # stabilizes BatchNorm & covariance

  eval_dataloder_cfg:
    num_workers: 8
    batch_size: 400
    shuffle: false

trainer_cfg:
  max_epochs: *max_epochs
  precision: 32            # safe → switch to 16 only if stable
  accelerator: gpu
  devices: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 1
  fast_dev_run: false
  gradient_clip_val: 1.0   # prevents gradient explosion

